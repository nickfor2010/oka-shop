<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OKA Admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF6EE">
<link rel="icon" href="/img/admin-favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/admin-apple-touch-icon.png">
<link rel="manifest" href="/admin.webmanifest">
<meta name="apple-mobile-web-app-title" content="OKA 管理">
<meta name="application-name" content="OKA 管理">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/oka.css">
<script src="/js/theme.js"></script>
<style>
  .adm-top .wrap{display:flex;align-items:center;gap:14px;height:64px}
  .adm-top .who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .menu{position:relative}
  .menu > div{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px;min-width:220px;display:flex;flex-direction:column;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .menu > div button,.menu > div a{background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--ink);text-decoration:none;font-size:.92rem}
  .menu > div button:hover,.menu > div a:hover{background:var(--paper-2)}
  .login-card{max-width:380px;margin:72px auto;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
  .login-card .logo{width:72px;height:84px;margin:0 auto}
  .detail{grid-column:1/-1;border-top:1.5px dashed var(--line);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:700px){.detail{grid-template-columns:1fr}}
  .detail h4{font-family:var(--f-display);font-size:.9rem;margin:0 0 6px}
  .timeline{list-style:none;margin:0;padding:0;font-size:.85rem}
  .timeline li{padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .timeline .when{color:var(--ink-soft);min-width:88px;font-variant-numeric:tabular-nums}
  .msg-sent{color:var(--st-paid)}.msg-failed{color:#C2412D}.msg-skipped{color:var(--ink-soft)}
  .prod-day{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .prod-day header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .prod-day h3{font-size:1.15rem}
  table.ptable{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
  table.ptable th,table.ptable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
  table.ptable th:first-child,table.ptable td:first-child{text-align:left}
  table.ptable tfoot td{font-weight:800;border-bottom:0}
  .tscroll{overflow-x:auto}
  .weekdays{display:flex;flex-wrap:wrap;gap:6px}
  .weekdays label{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
  .weekdays input{position:absolute;opacity:0;pointer-events:none}
  .weekdays input:checked+span{font-weight:800}
  .weekdays label:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .closed{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .closed span{display:inline-flex;gap:6px;align-items:center;background:var(--paper-2);border-radius:999px;padding:3px 6px 3px 12px;font-size:.85rem;font-variant-numeric:tabular-nums}
  .closed button{border:0;background:none;font-weight:800;color:var(--ink-soft);padding:0 6px}
  .trow{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .trow .acts{display:flex;gap:6px;flex-wrap:wrap}
  .trow .btn,.small-btn{padding:6px 12px;font-size:.84rem}
  .inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:8px}
  .inline-form .field{flex:1;min-width:160px}
  @media print{.adm-top,.tabs,.no-print,footer{display:none!important}.prod-day{break-inside:avoid;border-color:#999}body{background:#fff}}
</style>
</head>
<body>
<header class="top adm-top">
  <div class="wrap">
    <a class="brand" href="/admin" aria-label="OKA admin"><span class="logo" aria-hidden="true"></span><span><b>OKA</b><small data-t="admTitle">Shop admin</small></span></a>
    <div class="who">
      <div class="themesw compact" role="group" aria-label="Day or night colors · 日間或夜間">
        <button type="button" data-theme-set="auto" title="Auto · 自動" aria-label="Auto · 自動"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
        <button type="button" data-theme-set="light" title="Day · 日間" aria-label="Day · 日間"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-set="dark" title="Night · 夜間" aria-label="Night · 夜間"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      </div>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">繁</button></div>
      <div class="menu" id="acct" hidden></div>
    </div>
  </div>
</header>
<main class="wrap" id="root" style="padding-block:24px 64px"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
